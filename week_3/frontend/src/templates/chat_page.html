<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Helper Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .chat-container {
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 16px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 75%;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: #0d6efd;
            color: white;
            margin-left: auto;
        }

        .bot-message {
            background-color: #e9ecef;
            color: black;
            margin-right: auto;
        }
    </style>
</head>

<body>
<div class="container chat-container py-4">
    <h3 class="text-center mb-3">Resume Helper Chatbot</h3>

    <div id="chatHistory" class="chat-history mb-3">
        <div class="message bot-message">
            Hello! Upload your resume PDF and ask me a question.
        </div>
    </div>

    <form id="chatForm" class="card p-3">
        <div class="mb-2">
            <input type="file" id="pdfInput" class="form-control-file" accept="application/pdf">
        </div>

        <div class="input-group">
            <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." required>
            <button class="btn btn-primary" type="submit">Send</button>
        </div>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    const BACKEND_URL = "{{ backend_url }}";

    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const pdfInput = document.getElementById("pdfInput");
    const chatHistory = document.getElementById("chatHistory");

    function addMessage(text, sender) {
        const messageDiv = document.createElement("div");

        messageDiv.classList.add("message");

        if (sender === "user") {
            messageDiv.classList.add("user-message");
        } else {
            messageDiv.classList.add("bot-message");
        }

        messageDiv.textContent = text;
        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    async function readPdfAsText(file) {
        if (!file) return "";

        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        let fullText = "";

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();

            const pageText = textContent.items
                .map(item => item.str)
                .join(" ");

            fullText += pageText + "\n";
        }

        return fullText;
    }


   chatForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const userMessage = messageInput.value;
    const pdfFile = pdfInput.files[0];

    let displayMessage = userMessage;

    if (pdfFile) {
        displayMessage += `\n📎 ${pdfFile.name}`;
    }

    addMessage(displayMessage, "user");

    const pdfText = await readPdfAsText(pdfFile);

    const data = {
        message: userMessage,
        pdf_text: pdfText
    };

    console.log("Sending JSON:", data);

    try {
        const response = await fetch(BACKEND_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        addMessage(result.reply || "No reply from backend yet.", "bot");

    } catch (error) {
        addMessage("Backend is not ready yet.", "bot");
        console.error(error);
    }

    messageInput.value = "";
    pdfInput.value = "";
});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
